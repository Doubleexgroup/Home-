<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doubleex Group</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
--accent:#e63946;
--text:#ffffff;
}

html,body{
margin:0;
padding:0;
min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
color:var(--text);
}

/* SFONDO */

body{
background:url("sfondo2.jpg") center/cover no-repeat fixed;
display:flex;
flex-direction:column;
}

/* MAIN */

main{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
text-align:center;
padding:70px 20px 30px;
}

/* LOGO PRINCIPALE */

.main-logo{
width:380px;
max-width:85vw;
margin-bottom:45px;
}

/* SEZIONE CENTRALE */

.middle-section{
display:flex;
gap:55px;
align-items:center;
justify-content:center;
margin-bottom:45px;
flex-wrap:wrap;
}

.logo img{
width:200px;
transition:0.35s;
}

.logo img:hover{
transform:scale(1.15);
}

/* LOGO BASSO */

.bottom-logo img{

width:230px;

filter:drop-shadow(0 0 10px rgba(255,255,255,0.6));

transition:all .4s;

animation:float 4s ease-in-out infinite;

}

.bottom-logo img:hover{

transform:scale(1.18);

filter:drop-shadow(0 0 20px rgba(255,255,255,0.9));

}

@keyframes float{

0%{transform:translateY(0)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0)}

}

/* FOOTER */

footer{
padding:35px 20px;
text-align:center;
}

.footer-section{
margin-bottom:18px;
}

.footer-section h3{
color:var(--accent);
}

.contact-item{
margin-bottom:6px;
}

.footer-bottom{
border-top:1px solid rgba(255,255,255,0.2);
padding-top:10px;
font-size:0.85rem;
}

.footer-bottom a{
cursor:pointer;
}

/* MODAL */

#modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:9999;
}

.modal-box{
background:#fff;
color:#000;
padding:20px;
max-width:600px;
border-radius:8px;
max-height:80%;
overflow:auto;
}

/* COOKIE */

#cookieBanner{
position:fixed;
bottom:0;
width:100%;
background:#111;
color:#fff;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
z-index:9999;
}

.cookie-buttons button{
margin-left:10px;
padding:8px 12px;
border:none;
cursor:pointer;
}

.accept{
background:#2ecc71;
color:#fff;
}

.reject{
background:#e74c3c;
color:#fff;
}

/* RESPONSIVE */

@media (max-width:900px){

.main-logo{
width:300px;
margin-bottom:40px;
}

.middle-section{
gap:35px;
margin-bottom:40px;
}

.logo img{
width:170px;
}

.bottom-logo img{
width:200px;
}

}

@media (max-width:600px){

main{
padding-top:60px;
}

.main-logo{
width:230px;
margin-bottom:35px;
}

.middle-section{
flex-direction:column;
gap:28px;
margin-bottom:35px;
}

.logo img{
width:160px;
}

.bottom-logo img{
width:190px;
}

}

</style>

</head>

<body>

<main>

<img src="Group2 no sfondo.png" class="main-logo">

<div class="middle-section">

<a href="https://doubleexhome.com/" target="_blank" class="logo">
<img src="Home2 no sfondo.png">
</a>

<a href="https://www.romaprimeliving.it/" target="_blank" class="logo">
<img src="Living2 no sfondo.png">
</a>

</div>

<a href="https://dinnerinthesky.it/" target="_blank" class="bottom-logo">
<img src="dinner2 no sfondo.png">
</a>

</main>

<footer>

<div class="footer-section">

<h3>Contatti</h3>

<div class="contact-item">
<i class="fas fa-phone"></i> +39 3755248477
</div>

<div class="contact-item">
<i class="fas fa-envelope"></i> doubleexgroup@gmail.com
</div>

<div class="contact-item">
<i class="fas fa-map-marker-alt"></i> Via Pomarico 58, Roma
</div>

</div>

<div class="footer-bottom">

© 2026 Doubleexgroup LTD |

<a onclick="openModal('privacy')">Privacy</a> |

<a onclick="openModal('cookie')">Cookie</a> |

<a onclick="openModal('termini')">Termini</a>

</div>

</footer>

<div id="modal">

<div class="modal-box">

<h2 id="title"></h2>

<div id="text"></div>

<br>

<button onclick="closeModal()">Chiudi</button>

</div>

</div>

<div id="cookieBanner">

<span>Utilizziamo cookie tecnici e, previo consenso, cookie di analisi e marketing.</span>

<div class="cookie-buttons">

<button class="accept" onclick="acceptCookies()">Accetta</button>

<button class="reject" onclick="rejectCookies()">Rifiuta</button>

</div>

</div>

<script>

function openModal(type){

let t=document.getElementById("title");
let c=document.getElementById("text");

if(type==="privacy"){
t.innerText="Privacy Policy";
c.innerHTML="Questo sito non raccoglie direttamente dati personali.";
}

if(type==="cookie"){
t.innerText="Cookie Policy";
c.innerHTML="Il sito utilizza cookie tecnici necessari.";
}

if(type==="termini"){
t.innerText="Termini";
c.innerHTML="Questo sito ha finalità informativa.";
}

document.getElementById("modal").style.display="flex";

}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function acceptCookies(){
localStorage.setItem("cookies","accepted");
document.getElementById("cookieBanner").style.display="none";
}

function rejectCookies(){
localStorage.setItem("cookies","rejected");
document.getElementById("cookieBanner").style.display="none";
}

window.onload=function(){

const status=localStorage.getItem("cookies");

if(status!=="accepted" && status!=="rejected"){
document.getElementById("cookieBanner").style.display="flex";
}

}

</script>

</body>
</html>
