<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doubleex Group</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
--accent:#e63946;
--text:#ffffff;
--glass:rgba(255,255,255,0.05);
}

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
min-height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
color:var(--text);
}

body{

background:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.65)),
url("sfondo2.jpg") center/cover no-repeat;

display:flex;
flex-direction:column;

}

/* MAIN */

main{

flex:1;

display:flex;
flex-direction:column;

align-items:center;
justify-content:flex-start;

text-align:center;

padding:80px 20px 40px;

}

/* LOGO PRINCIPALE */

.main-logo{

width:380px;
max-width:85vw;

margin-bottom:55px;

filter:drop-shadow(0 0 15px rgba(255,255,255,0.35));

}

/* SEZIONE LOGHI */

.logo-grid{

display:grid;

grid-template-columns:repeat(2,auto);

justify-content:center;

gap:55px;

margin-bottom:12px;

}

/* LOGHI */

.logo img{

width:200px;

transition:all .35s ease;

filter:drop-shadow(0 0 6px rgba(255,255,255,0.3));

}

.logo img:hover{

transform:scale(1.15);

filter:
drop-shadow(0 0 12px rgba(255,255,255,0.7))
drop-shadow(0 0 25px rgba(255,255,255,0.4));

}

/* LOGO BASSO */

.bottom-logo{

margin-top:2px;

}

.bottom-logo img{

width:230px;

transition:all .4s;

filter:drop-shadow(0 0 12px rgba(255,255,255,0.6));

animation:float 4s ease-in-out infinite;

}

.bottom-logo img:hover{

transform:scale(1.18);

filter:
drop-shadow(0 0 18px rgba(255,255,255,0.9))
drop-shadow(0 0 35px rgba(255,255,255,0.6));

}

/* FLOAT ANIMATION */

@keyframes float{

0%{transform:translateY(0)}

50%{transform:translateY(-8px)}

100%{transform:translateY(0)}

}

/* FOOTER */

footer{

background:rgba(0,0,0,0.55);

backdrop-filter:blur(6px);

padding:40px 20px;

text-align:center;

font-size:0.95rem;

}

/* FOOTER CONTATTI */

.footer-section{

margin-bottom:20px;

}

.footer-section h3{

color:var(--accent);

margin-bottom:10px;

font-weight:600;

}

.contact-item{

margin-bottom:6px;

opacity:0.9;

}

/* FOOTER BOTTOM */

.footer-bottom{

border-top:1px solid rgba(255,255,255,0.2);

padding-top:12px;

font-size:0.85rem;

opacity:0.8;

}

.footer-bottom a{

cursor:pointer;

margin:0 6px;

transition:0.3s;

}

.footer-bottom a:hover{

color:var(--accent);

}

/* MODAL */

#modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.8);

justify-content:center;
align-items:center;

z-index:9999;

}

.modal-box{

background:#fff;

color:#000;

padding:25px;

max-width:600px;

border-radius:8px;

max-height:80%;

overflow:auto;

}

/* COOKIE */

#cookieBanner{

position:fixed;

bottom:0;

width:100%;

background:#111;

color:#fff;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

z-index:9999;

font-size:0.9rem;

}

.cookie-buttons button{

margin-left:10px;

padding:8px 12px;

border:none;

cursor:pointer;

border-radius:4px;

}

.accept{

background:#2ecc71;

color:#fff;

}

.reject{

background:#e74c3c;

color:#fff;

}

/* RESPONSIVE */

@media (max-width:900px){

.main-logo{

width:300px;

margin-bottom:45px;

}

.logo-grid{

gap:35px;

}

.logo img{

width:170px;

}

.bottom-logo img{

width:200px;

}

}

@media (max-width:600px){

main{

padding-top:60px;

}

.main-logo{

width:230px;

margin-bottom:40px;

}

.logo-grid{

grid-template-columns:1fr;

gap:30px;

}

.logo img{

width:160px;

}

.bottom-logo img{

width:185px;

}

}

</style>

</head>

<body>

<main>

<img src="Group2 no sfondo.png" class="main-logo">

<div class="logo-grid">

<a href="https://doubleexhome.com/" target="_blank" class="logo">
<img src="Home2 no sfondo.png">
</a>

<a href="https://www.romaprimeliving.it/" target="_blank" class="logo">
<img src="Living2 no sfondo.png">
</a>

</div>

<a href="https://dinnerinthesky.it/" target="_blank" class="bottom-logo">
<img src="dinner2 no sfondo.png">
</a>

</main>

<footer>

<div class="footer-section">

<h3>Contatti</h3>

<div class="contact-item">
<i class="fas fa-phone"></i> +39 3755248477
</div>

<div class="contact-item">
<i class="fas fa-envelope"></i> doubleexgroup@gmail.com
</div>

<div class="contact-item">
<i class="fas fa-map-marker-alt"></i> Via Pomarico 58, Roma
</div>

</div>

<div class="footer-bottom">

© 2026 Doubleexgroup LTD |

<a onclick="openModal('privacy')">Privacy</a> |

<a onclick="openModal('cookie')">Cookie</a> |

<a onclick="openModal('termini')">Termini</a>

</div>

</footer>

<div id="modal">
<div class="modal-box">
<h2 id="title"></h2>
<div id="text"></div>
<br>
<button onclick="closeModal()">Chiudi</button>
</div>
</div>

<div id="cookieBanner">

<span>Utilizziamo cookie tecnici e, previo consenso, cookie di analisi e marketing.</span>

<div class="cookie-buttons">
<button class="accept" onclick="acceptCookies()">Accetta</button>
<button class="reject" onclick="rejectCookies()">Rifiuta</button>
</div>

</div>

<script>

function openModal(type){

let t=document.getElementById("title");
let c=document.getElementById("text");

if(type==="privacy"){
t.innerText="Privacy Policy";
c.innerHTML="Questo sito non raccoglie direttamente dati personali.";
}

if(type==="cookie"){
t.innerText="Cookie Policy";
c.innerHTML="Il sito utilizza cookie tecnici necessari.";
}

if(type==="termini"){
t.innerText="Termini";
c.innerHTML="Questo sito ha finalità informativa.";
}

document.getElementById("modal").style.display="flex";

}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function acceptCookies(){
localStorage.setItem("cookies","accepted");
document.getElementById("cookieBanner").style.display="none";
}

function rejectCookies(){
localStorage.setItem("cookies","rejected");
document.getElementById("cookieBanner").style.display="none";
}

window.onload=function(){

const status=localStorage.getItem("cookies");

if(status!=="accepted" && status!=="rejected"){
document.getElementById("cookieBanner").style.display="flex";
}

}

</script>

</body>
</html>
