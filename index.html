<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing | Azienda</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
  --accent-color: #e63946;
  --text-color: #ffffff;
}

/* Sfondo su html */
html {
  height:100%;
  background:none;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* Corpo trasparente */
body {
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text-color);
  min-height:100%;
  display:flex;
  flex-direction:column;
  background:transparent;
}

/* Main */
main {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:50px 20px;
  background:transparent; /* trasparente */
}

h1 { font-size:2.6rem; margin-bottom:10px; }
.subtitle { opacity:0.8; margin-bottom:50px; }

/* Piramide loghi */
.pyramid { display:flex; flex-direction:column; align-items:center; gap:50px; }
.pyramid-bottom { display:flex; gap:70px; flex-wrap:wrap; justify-content:center; }
.logo img { width:150px; transition:0.3s; }
.logo:hover img { transform:scale(1.1); }

/* Footer trasparente */
footer {
  padding:40px 20px;
  text-align:center;
  background:transparent;
}

.footer-section { margin-bottom:20px; }
.footer-section h3 { color:var(--accent-color); margin-bottom:10px; }
.contact-item { margin-bottom:8px; }

.footer-bottom {
  border-top:1px solid rgba(255,255,255,0.2);
  padding-top:10px;
  font-size:0.85rem;
}

/* MODAL */
#modal {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.modal-box {
  background:#fff;
  color:#000;
  padding:20px;
  max-width:600px;
  border-radius:8px;
  max-height:80%;
  overflow:auto;
}

/* COOKIE BANNER */
#cookieBanner {
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  z-index:9999;
}
.cookie-buttons button {
  margin-left:10px;
  padding:8px 12px;
  border:none;
  cursor:pointer;
}
.accept { background:#2ecc71; }
.reject { background:#e74c3c; }
</style>
</head>

<body>

<main>
<h1></h1> 
<p class="subtitle"></p> 

<div class="pyramid">
  <img src="Doubleexgroup2-nosfondo.png" width="260">

  <div class="pyramid-bottom">
    <a href="https://doubleexhome.com/" target="_blank" class="logo"><img src="Doubleexhome2-no sfondo.png"></a>
    <a href="https://dinnerinthesky.it/" target="_blank" class="logo"><img src="dinnerinthesky-no sfondo.png"></a>
    <a href="https://www.romaprimeliving.it/" target="_blank" class="logo"><img src="Romaliving-no sfondo.png"></a>
  </div>
</div>
</main>

<footer>
<div class="footer-section">
<h3>Contatti</h3>
<div class="contact-item"><i class="fas fa-phone"></i> +39 3755248477</div>
<div class="contact-item"><i class="fas fa-envelope"></i> doubleexgroup@gmail.com</div>
<div class="contact-item"><i class="fas fa-map-marker-alt"></i> Via Pomarico 58, 00178 Roma</div>
</div>

<div class="footer-bottom">
© 2026 Doubleexgroup LTD |
<a onclick="openModal('privacy')">Privacy</a> |
<a onclick="openModal('cookie')">Cookie</a> |
<a onclick="openModal('termini')">Termini</a>
</div>
</footer>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h2 id="title"></h2>
    <div id="text"></div>
    <button onclick="closeModal()">Chiudi</button>
  </div>
</div>

<!-- COOKIE BANNER -->
<div id="cookieBanner">
  <span>Utilizziamo cookie tecnici e, previo consenso, cookie di analisi e marketing.</span>
  <div class="cookie-buttons">
    <button class="accept" onclick="acceptCookies()">Accetta</button>
    <button class="reject" onclick="rejectCookies()">Rifiuta</button>
  </div>
</div>

<script>
// ==========================
// SFONDO SU HTML
// ==========================
const backgroundImage = 'sonfdo1.jpg'; // <-- sostituisci qui l'immagine
if(backgroundImage && backgroundImage.trim() !== ''){
    document.documentElement.style.background = `url(${backgroundImage}) center/cover no-repeat`;
}

// ==========================
// MODAL
// ==========================
function openModal(type){
  let t=document.getElementById("title");
  let c=document.getElementById("text");

  if(type==="privacy"){
    t.innerText="Privacy Policy";
    c.innerHTML="Questo sito non raccoglie direttamente dati personali.<br><br>Durante la navigazione possono essere acquisiti dati tecnici (come indirizzo IP) necessari al funzionamento e alla sicurezza.<br><br>Il sito contiene collegamenti a piattaforme esterne, che operano come titolari autonomi del trattamento dei dati.<br><br>Per informazioni: doubleexgroup@gmail.com.";
  }

  if(type==="cookie"){
    t.innerText="Cookie Policy";
    c.innerHTML="Questo sito utilizza cookie tecnici necessari al funzionamento.<br><br>Previo consenso, possono essere utilizzati cookie di analisi e marketing.<br><br>L’utente può accettare o rifiutare tali cookie tramite il banner.";
  }

  if(type==="termini"){
    t.innerText="Termini e Condizioni";
    c.innerHTML="Questo sito ha finalità esclusivamente informativa e di reindirizzamento verso siti esterni.<br><br>Non siamo responsabili dei contenuti, servizi o trattamenti effettuati da siti terzi.<br><br>L’utilizzo del sito avviene sotto la responsabilità dell’utente.";
  }

  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

// ==========================
// COOKIE
// ==========================
function acceptCookies(){
  localStorage.setItem("cookies","accepted");
  document.getElementById("cookieBanner").style.display="none";
}

function rejectCookies(){
  localStorage.setItem("cookies","rejected");
  document.getElementById("cookieBanner").style.display="none";
}

window.onload = function(){
  const status = localStorage.getItem("cookies");
  if(status !== "accepted" && status !== "rejected"){
    document.getElementById("cookieBanner").style.display = "flex";
  }
}
</script>

</body>
</html>
