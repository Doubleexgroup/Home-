<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doubleex Group</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
--accent:#e63946;
--text:#ffffff;
}

html,body{
margin:0;
padding:0;
min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
color:var(--text);
}

body{

background:url("sfondo4.jpg") center/cover no-repeat fixed;

display:flex;

flex-direction:column;

}

/* MAIN */

main{

flex:1;

display:flex;

justify-content:center;

align-items:flex-start;

padding:40px 20px;

}

/* GRID LOGHI */

.logo-grid{

display:grid;

grid-template-columns:1fr 1fr;

grid-template-areas:

"top top"

"left right"

"bottom bottom";

row-gap:20px;

column-gap:60px;

justify-items:center;

align-items:center;

}

/* LOGO PRINCIPALE */

.main-logo{

grid-area:top;

width:520px;

max-width:90vw;

}

/* LOGHI CENTRALI */

.logo-left{ grid-area:left; }
.logo-right{ grid-area:right; }

.logo img{

width:200px;

transition:all .35s ease;

}

.logo img:hover{

transform:scale(1.15);

filter:drop-shadow(0 0 15px rgba(255,255,255,0.7));

}

/* LOGO BASSO */

.bottom-logo{

grid-area:bottom;

}

.bottom-logo img{

width:230px;

transition:all .35s ease;

}

.bottom-logo img:hover{

transform:scale(1.15);

filter:drop-shadow(0 0 15px rgba(255,255,255,0.7));

}

/* FOOTER */

footer{

text-align:center;

padding:30px 20px;

background:transparent;

}

.footer-section{

margin-bottom:15px;

}

.footer-section h3{

color:var(--accent);

}

.contact-item{

margin-bottom:6px;

}

.footer-bottom{

border-top:1px solid rgba(255,255,255,0.3);

padding-top:10px;

font-size:0.85rem;

}

.footer-bottom a{

cursor:pointer;

color:white;

}

/* MODAL */

#modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,0.8);

justify-content:center;

align-items:center;

z-index:9999;

}

.modal-box{

background:#fff;

color:#000;

padding:20px;

max-width:600px;

border-radius:8px;

}

/* COOKIE */

#cookieBanner{

position:fixed;

bottom:0;

width:100%;

background:#111;

color:#fff;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

z-index:9999;

}

.cookie-buttons button{

margin-left:10px;

padding:8px 12px;

border:none;

cursor:pointer;

}

.accept{ background:#2ecc71; color:#fff; }

.reject{ background:#e74c3c; color:#fff; }

/* MOBILE */

@media(max-width:700px){

.logo-grid{

grid-template-columns:1fr;

grid-template-areas:

"top"

"left"

"right"

"bottom";

row-gap:25px;

}

.main-logo{

width:260px;

}

.logo img{

width:160px;

}

.bottom-logo img{

width:180px;

}

}

</style>

</head>

<body>

<main>

<div class="logo-grid">

<img src="Group2-no-sfondo.png" class="main-logo">

<a href="https://doubleexhome.com/" class="logo logo-left" target="_blank">
<img src="Home2-no-sfondo.png">
</a>

<a href="https://www.romaprimeliving.it/" class="logo logo-right" target="_blank">
<img src="Living2-no-sfondo.png">
</a>

<a href="https://dinnerinthesky.it/" class="bottom-logo" target="_blank">
<img src="dinner2.png">
</a>

</div>

</main>

<footer>

<div class="footer-section">

<h3>Contatti</h3>

<div class="contact-item">
<i class="fas fa-phone"></i> +39 3755248477
</div>

<div class="contact-item">
<i class="fas fa-envelope"></i> doubleexgroup@gmail.com
</div>

<div class="contact-item">
<i class="fas fa-map-marker-alt"></i> Via Pomarico 58, Roma
</div>

</div>

<div class="footer-bottom">

© 2026 Doubleexgroup LTD |

<a onclick="openModal('privacy')">Privacy</a> |

<a onclick="openModal('cookie')">Cookie</a> |

<a onclick="openModal('termini')">Termini</a>

</div>

</footer>

</body>
</html>
