<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing | Azienda</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
  --background-color:#1e3a8a;
  --text-color:#fff;
  --accent-color:#e63946;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{display:flex;flex-direction:column;min-height:100vh;background:var(--background-color);color:var(--text-color);}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;}
h1{font-size:2.5rem;}
.subtitle{opacity:.8;margin-bottom:40px;}

.pyramid{display:flex;flex-direction:column;gap:40px;align-items:center;}
.pyramid-bottom{display:flex;gap:60px;flex-wrap:wrap;}

.logo img{width:150px;transition:.3s;}
.logo:hover img{transform:scale(1.1);}

footer{text-align:center;padding:20px;}
.footer-bottom a{margin:0 5px;cursor:pointer;}

/* MODAL */
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);justify-content:center;align-items:center;}
.modal-box{background:#fff;color:#000;padding:20px;max-width:600px;border-radius:8px;}

/* COOKIE BANNER */
#cookieBanner{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  color:#fff;
  padding:15px;
  display:none;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  z-index:9999;
}

.cookie-buttons button{
  margin-left:10px;
  padding:8px 12px;
  border:none;
  cursor:pointer;
}

.accept{background:#2ecc71;}
.reject{background:#e74c3c;}
</style>
</head>

<body>

<main>
<h1>Scopri le nostre destinazioni</h1>
<p class="subtitle">Seleziona uno dei nostri siti</p>

<div class="pyramid">
  <img src="Double Ex Events Srls 2.png" width="250">

  <div class="pyramid-bottom">
    <a href="https://doubleexhome.com/" target="_blank" class="logo"><img src="doubleexhome 3.png"></a>
    <a href="https://dinnerinthesky.it/" target="_blank" class="logo"><img src="dinner logo.png"></a>
    <a href="https://www.romaprimeliving.it/" target="_blank" class="logo"><img src="Roma prime living.png"></a>
  </div>
</div>
</main>

<footer>
© 2026 Doubleexgroup |
<a onclick="openModal('privacy')">Privacy</a> |
<a onclick="openModal('cookie')">Cookie</a> |
<a onclick="openModal('termini')">Termini</a>
</footer>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h2 id="title"></h2>
    <p id="text"></p>
    <button onclick="closeModal()">Chiudi</button>
  </div>
</div>

<!-- COOKIE BANNER -->
<div id="cookieBanner">
  <span>Utilizziamo cookie tecnici e, previo consenso, cookie di analisi e marketing.</span>
  <div class="cookie-buttons">
    <button class="accept" onclick="acceptCookies()">Accetta</button>
    <button class="reject" onclick="rejectCookies()">Rifiuta</button>
  </div>
</div>

<script>
// MODAL
function openModal(type){
  let t=document.getElementById("title");
  let c=document.getElementById("text");

  if(type==="privacy"){
    t.innerText="Privacy Policy";
    c.innerText="Questo sito raccoglie dati tecnici (es. IP). Può utilizzare strumenti di analisi e marketing previo consenso. I link esterni gestiscono i dati in autonomia.";
  }
  if(type==="cookie"){
    t.innerText="Cookie Policy";
    c.innerText="Il sito utilizza cookie tecnici e, previo consenso, cookie di analisi e marketing. Puoi accettare o rifiutare tramite il banner.";
  }
  if(type==="termini"){
    t.innerText="Termini";
    c.innerText="Sito informativo con reindirizzamento verso terzi. Nessuna responsabilità sui contenuti esterni.";
  }

  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

// COOKIE LOGIC
function acceptCookies(){
  localStorage.setItem("cookies","accepted");
  document.getElementById("cookieBanner").style.display="none";

  // 👉 QUI puoi inserire script tipo Google Analytics o Meta Pixel
  console.log("Cookie accettati");
}

function rejectCookies(){
  localStorage.setItem("cookies","rejected");
  document.getElementById("cookieBanner").style.display="none";
}

// SHOW BANNER
window.onload=function(){
  if(!localStorage.getItem("cookies")){
    document.getElementById("cookieBanner").style.display="flex";
  }
}
</script>

</body>
</html>
